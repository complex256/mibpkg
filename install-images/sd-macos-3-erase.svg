<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img">
  <rect width="820" height="500" fill="#f4f5f7"/>

  <rect x="120" y="40" width="580" height="420" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="120" y="40" width="580" height="38" rx="10" fill="#e5e7eb"/>
  <rect x="120" y="68" width="580" height="10" fill="#e5e7eb"/>
  <circle cx="138" cy="59" r="5" fill="#ef4444"/>
  <circle cx="154" cy="59" r="5" fill="#f59e0b"/>
  <circle cx="170" cy="59" r="5" fill="#10b981"/>
  <text x="410.0" y="64" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1d2433">Disk Utility</text>

  <rect x="120" y="78" width="580" height="382" fill="#ffffff"/>
  <text x="150" y="120" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#1d2433">Erase “SD Card”</text>

  <text x="150" y="149" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">Name</text>
  <rect x="150" y="155" width="500" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="177" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">SD Card</text>


  <text x="150" y="214" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">Format</text>
  <rect x="150" y="220" width="500" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="242" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">MS-DOS (FAT)</text>


  <text x="150" y="279" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">Scheme</text>
  <rect x="150" y="285" width="500" height="34" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="307" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">Master Boot Record</text>

  <rect x="150" y="345" width="130" height="36" rx="7" fill="#2563eb"/>
  <text x="215" y="368" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#ffffff">Erase</text>
  <rect x="295" y="345" width="120" height="36" rx="7" fill="#e5e7eb"/>
  <text x="355" y="368" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">Cancel</text>

  <circle cx="140" cy="410" r="16" fill="#2563eb"/>
  <text x="140" y="415" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <rect x="164" y="394" width="320" height="32" rx="16" fill="#dbeafe"/>
  <text x="178" y="415" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">FAT + Master Boot Record, then Erase</text>


</svg>
