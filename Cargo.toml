[package]
name = "mibpkg"
version = "0.4.2"
edition = "2021"
description = "Package manager for MIB2 High head units"
license = "MIT"

[dependencies]
anyhow = "1"
flate2 = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
