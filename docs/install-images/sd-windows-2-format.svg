<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img">
  <rect width="820" height="500" fill="#f4f5f7"/>

  <rect x="80" y="40" width="660" height="430" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="80" y="40" width="660" height="38" rx="10" fill="#e5e7eb"/>
  <rect x="80" y="68" width="660" height="10" fill="#e5e7eb"/>
  <circle cx="98" cy="59" r="5" fill="#ef4444"/>
  <circle cx="114" cy="59" r="5" fill="#f59e0b"/>
  <circle cx="130" cy="59" r="5" fill="#10b981"/>
  <text x="410.0" y="64" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1d2433">Format</text>

  <rect x="80" y="78" width="660" height="392" fill="#ffffff"/>
  <text x="110" y="120" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#1d2433">Format options</text>

  <text x="110" y="149" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">File system</text>
  <rect x="110" y="155" width="250" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="177" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">FAT32</text>


  <text x="390" y="149" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">Allocation unit size</text>
  <rect x="390" y="155" width="250" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="177" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">Default</text>


  <text x="110" y="224" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#6b7280">Volume label</text>
  <rect x="110" y="230" width="250" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="252" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">SD Card</text>

  <text x="110" y="305" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">Partition scheme</text>
  <rect x="110" y="318" width="250" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="122" y="342" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">Master Boot Record (MBR)</text>
  <text x="390" y="342" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#6b7280">Do not choose GPT/GUID.</text>
  <text x="110" y="390" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#b45309">A GUID card makes the SD-card option in the update menu greyed out.</text>

  <circle cx="390" cy="235" r="16" fill="#2563eb"/>
  <text x="390" y="240" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <rect x="414" y="219" width="260" height="32" rx="16" fill="#dbeafe"/>
  <text x="428" y="240" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#1d2433">FAT32 on MBR, then Start</text>


</svg>
